# REG error catalog — English texts, verbatim from the module's error-catalog block.
# Keyed by error code; named placeholders are filled from the exception's arguments.
# Arabic texts: PENDING ADR-REG-011 — never invented here.
REG-404-SERVICE-NOT-FOUND=The service "{serviceCode}" is not available.
REG-500=The service registry could not complete the request.

# REG load reason codes (ADR-REG-011) — English texts, verbatim from the SVC-API load reason table.
# Keyed by REG-LOAD-* code; these are Load Result reasons written to the load report, never HTTP errors.
# Arabic texts: PENDING ADR-REG-011 — never invented here.
REG-LOAD-INCOMPLETE-PACKAGE=The service package "{folder}" is incomplete: it needs both its service knowledge and its service definition.
REG-LOAD-DUPLICATE-SERVICE-CODE=The service code "{serviceCode}" is declared by more than one package folder; keep one folder per service.
REG-LOAD-VERSION-EDITED-IN-PLACE=Version {versionNumber} of "{serviceCode}" already exists with different content; publish the change as a new version.
REG-LOAD-VERSION-OLDER-THAN-CURRENT=Version {versionNumber} of "{serviceCode}" is older than the current version {currentVersion}.
REG-LOAD-CONNECTION-NOT-ACTIVATED=The query "{queryName}" uses the connection "{connectionName}", which is not activated in this environment.
REG-LOAD-UNBOUND-PARAMETER=The query "{queryName}" uses "{marker}"; queries take only the bind parameter ":{inputName}".
REG-LOAD-NOT-SINGLE-SELECT=The query "{queryName}" must be one SELECT statement; it cannot change data or run several statements.
REG-LOAD-UNKNOWN-FETCH-MODE=The fetch mode "{fetchMode}" is not supported; use path, blob or manual.
REG-LOAD-DOCUMENT-SOURCE-INCOMPLETE=The documents of "{serviceCode}" cannot be fetched: the document source is incomplete.
REG-LOAD-BLOB-NOT-JDBC=Documents stored in the database are read over a read-only jdbc connection; "{connectionName}" is not one.
REG-LOAD-APPROVAL-API-UNDEFINED=The approval API of "{serviceCode}" is enabled but not defined.
REG-LOAD-ELEMENT-NOT-ALLOWED=The service definition of "{serviceCode}" contains "{element}", which a service definition cannot set.
REG-LOAD-DUPLICATE-CONNECTION-NAME=The connection name "{connectionName}" is listed more than once.
REG-LOAD-UNKNOWN-CONNECTION-TYPE=The connection "{connectionName}" has the type "{connectionType}"; use mcp or jdbc.
REG-LOAD-CONNECTION-NOT-READ-ONLY=The connection "{connectionName}" must use a read-only database user.
REG-LOAD-EMPTY-SERVICE-KNOWLEDGE=The service knowledge of "{serviceCode}" is empty.
REG-LOAD-DUPLICATE-QUERY-NAME=The query name "{queryName}" is used twice in "{serviceCode}".
REG-LOAD-FOREIGN-FILE-IN-PACKAGE=The package folder "{folder}" holds "{file}"; a package folder holds only its service knowledge and its service definition.
REG-LOAD-DUPLICATE-DOCUMENT-TYPE=The document type "{documentType}" is required more than once in "{serviceCode}".
REG-LOAD-INVALID-SERVICE-CODE=The service code "{serviceCode}" is not valid; use lower-case letters, digits and single hyphens, at most 100 characters.
REG-LOAD-PACKAGE-DIRECTORY-UNAVAILABLE=The package directory "{directory}" is missing, unreadable or empty; no service was loaded or withdrawn.
REG-LOAD-PACKAGE-CHANGED-DURING-READ=The package folder "{folder}" changed while it was being read; publish it again and restart.
REG-LOAD-CONNECTION-TYPE-BREAKS-BLOB=The connection "{connectionName}" must stay of type jdbc: version {versionNumber} of "{serviceCode}" reads its documents through it.
REG-LOAD-PACKAGE-FILE-UNREADABLE=The file "{file}" of the package folder "{folder}" cannot be read; check its permissions and restart.
REG-LOAD-VALUE-TOO-LONG=The {field} of "{subject}" has {length} characters; at most {limit} are allowed.

# DOC error catalog — English texts, verbatim from the module's error-catalog block (ADR-DOC-012).
# Keyed by error code; named placeholders are filled from the exception's arguments.
# Arabic texts: PENDING ADR-DOC-012 — never invented here.
DOC-400-CHECK-ID-REQUIRED=A numeric Check identifier is required.
DOC-500=Document access could not complete the request.

# DOC in-process rejection codes (ADR-DOC-012) — English texts, verbatim from the SVC-API in-process rejection table.
# Keyed by code; raised as typed exceptions of the DocumentAccess interface and mapped to ProblemDetail by INT —
# never rows of DOC's own HTTP error catalog. The last key is the RULE-DOC-005 notice carried in UploadReceipt.notice:
# a message key, not an error code. Arabic texts: PENDING ADR-DOC-012 — never invented here.
DOC-400-INCOMPLETE-UPLOAD=The upload needs a Check, a document type and a file that is not empty.
DOC-404-SERVICE-VERSION-NOT-FOUND=service package version not found
DOC-422-FETCH-MODE-NOT-MANUAL=Documents can be uploaded only for a service whose documents are provided by the employee; the service "{serviceCode}" obtains its documents by "{fetchMode}".
DOC-422-DOCUMENT-TYPE-NOT-OF-SERVICE="{documentType}" is not a document type of the service "{serviceCode}"; choose one of: {requiredDocumentTypes}.
DOC-409-CHECK-ENDED=The Check {checkId} has already ended; documents can no longer be uploaded for it. Start a new check to provide these documents.
DOC-422-UPLOAD-LIMIT-REACHED=The Check {checkId} already has the maximum of {maxUploads} uploaded documents; no further file can be uploaded for it.
DOC-NOTICE-OVERSIZED-UPLOAD=The file "{fileName}" is larger than the maximum file size of {maxFileSize}; it will not be read and will be reported as unreadable.

# CHK error catalog — English texts, verbatim from the module's error-catalog block (ADR-CHK-018).
# Keyed by error code; named placeholders are filled from the exception's arguments.
# Arabic texts: PENDING ADR-CHK-018 — never invented here.
CHK-400-CHECK-ID-INVALID=A numeric Check identifier is required.
CHK-404-ACTIVE-CHECK-NOT-FOUND=Check {checkId} is not waiting or running.
CHK-500=The Check Engine could not complete the request.

# CHK service-query texts (PORTS-QUERY) — message keys, NOT error codes: they are the detail of a
# service query recorded as not read (ADR-CHK-014) or an internal log line, never a ProblemDetail.
# Key scheme {MOD}-RULE-{NNN} for a business rule's message (verbatim from the plan's RULE-CHK-NNN),
# {MOD}-DETAIL-{SLUG} for a fixed not-read detail — same {MOD}-{KIND}-… shape as DOC-NOTICE-….
# Arabic texts: PENDING ADR-CHK-018 — never invented here.
CHK-RULE-002=The data of query "{queryName}" was not read: connection "{connectionName}" is not a read-only MCP connection.
CHK-RULE-003=The data of query "{queryName}" was not read: it has no bind parameter "{inputName}" for the request number.
CHK-RULE-005=Query "{queryName}" is the document source query; Document Access runs it.
CHK-DETAIL-QUERY-CHANNEL-ABSENT=the platform MCP query channel is not available in this deployable
CHK-DETAIL-QUERY-OUT-OF-TIME=the Check's timeout was reached before the query was sent
CHK-DETAIL-QUERY-NO-RESULT=the query returned no result through the MCP query channel
CHK-DETAIL-QUERY-OVER-ROW-LIMIT=more than {maxRows} rows

# CHK in-process rejection codes (ADR-CHK-018) — English texts, verbatim from the SVC-API in-process rejection table.
# Keyed by code; raised as typed exceptions of the CheckEngine interface (io.agenticai.chk.contract) and mapped to
# ProblemDetail by INT — never rows of CHK's own HTTP error catalog. Arabic texts: PENDING ADR-CHK-018.
CHK-400-START-INCOMPLETE=A Check needs a service code, a request number and the employee's identity.
CHK-422-SERVICE-NOT-AVAILABLE=The service "{serviceCode}" is not available for Checks.
CHK-422-CONNECTION-NOT-ACTIVATED=The service "{serviceCode}" cannot be checked: connection "{connectionName}" is not activated in this environment.
CHK-404-CHECK-NOT-FOUND=Check {checkId} does not exist.
CHK-409-CHECK-NOT-AWAITING-DOCUMENTS=Check {checkId} is not waiting for documents; its status is {status}.

# CHK SVC-API rule texts — message keys, NOT error codes (verbatim from the plan's RULE-CHK-NNN): a finding's note
# (004, 006), a FAILED Check's detail (007) or an internal log line (008). The interrupted detail is the plan's
# literal text of StartupRecoveryService step 1. Arabic texts: PENDING ADR-CHK-018.
CHK-RULE-004=Required document "{documentType}": {readStatus}{reasonSuffix}.
CHK-REQ-040=The comparison model gave no evidence for this condition; please verify the condition yourself.
CHK-RULE-006=The limit "{limit}" of this condition is not stated in the service knowledge; please verify the condition yourself.
CHK-RULE-007=Check {checkId} could not be run: version {versionNumber} of "{serviceCode}" could not be resolved.
CHK-RULE-008=Check {checkId} already has an Active Check; the second start of its pipeline was not run.
CHK-RULE-009=An Active Check can only be AWAITING_DOCUMENTS or RUNNING; status {checkStatus} was not stored.
CHK-DETAIL-INTERRUPTED=interrupted by a restart of the service

# RPT error catalog — English texts, verbatim from the module's error-catalog block (ADR-RPT-013).
# Keyed by error code; named placeholders are filled from the exception's arguments.
# Arabic texts: PENDING ADR-RPT-013 — never invented here.
RPT-400-CHECK-ID-INVALID=A numeric Check identifier is required.
RPT-404-CHECK-NOT-FOUND=Check {checkId} was not found.
RPT-400-REQUEST-KEYS-MISSING=Both a service code and a request number are needed to list Checks.
RPT-400-SERVICE-CODE-MISSING=A service code is needed to read the decision agreement.
RPT-500=The Report Store could not complete the request.

# RPT log texts — message keys, NOT error codes: an internal log line, never a ProblemDetail.
# Key scheme {MOD}-LOG-{SLUG}, the same {MOD}-{KIND}-… shape as DOC-NOTICE-… / CHK-DETAIL-….
# RPT-LOG-PURGE-SKIPPED: the purge's skip line, verbatim from REQ-RPT-044 / AC-RPT-052 (ADR-RPT-010);
# read through ReportStoreTexts.PURGE_SKIPPED. Arabic texts: PENDING ADR-RPT-013.
RPT-LOG-PURGE-SKIPPED=Report purge skipped: no valid report retention period is configured.

# RPT in-process rejection codes (ADR-RPT-012, ADR-RPT-013 point 2) — English texts, verbatim from the SVC-API
# in-process rejection table. Keyed by code; a code with several messages is keyed by code + ".{SLUG}" per message.
# Raised as typed exceptions of io.agenticai.rpt.contract (RptRefusalException) — never rows of RPT's own HTTP
# error catalog. RPT-404-CHECK-NOT-FOUND is the catalog key above (same code, same text). Arabic texts:
# PENDING ADR-RPT-013 — never invented here.
RPT-400-CHECK-RUN-INCOMPLETE=The Check run was not stored: {field} is missing.
RPT-422-INITIAL-STATUS-MISMATCH.AWAITING-NEEDS-MANUAL=The Check run was not stored: status AWAITING_DOCUMENTS needs fetch mode manual.
RPT-422-INITIAL-STATUS-MISMATCH.MANUAL-STARTS-AWAITING=The Check run was not stored: a manual Check starts AWAITING_DOCUMENTS.
RPT-409-CHECK-ENDED=Check {checkId} has already ended; its status cannot change.
RPT-409-CHECK-NOT-RUNNING=Check {checkId} is not running; it cannot be completed.
RPT-422-METADATA-MISMATCH.DIFFERS=The report of Check {checkId} was not stored: its metadata {field} {value} differs from the Check run ({stored}).
RPT-422-METADATA-MISMATCH.MISSING=The report of Check {checkId} was not stored: {field} is missing.
RPT-422-COMPLIANT-NOT-VERIFIED=The report of Check {checkId} was not stored: COMPLIANT needs every finding SATISFIED and every service query read.
RPT-422-UNKNOWN-CODE=Not stored: `{value}` is not a code of {lookupKey}.
RPT-422-FINDING-INCOMPLETE=The report of Check {checkId} was not stored: finding {position} has no {field}.
RPT-422-DOCUMENT-REASON-MISMATCH.REASON-MISSING=The report of Check {checkId} was not stored: document {position} is UNREADABLE without a reason.
RPT-422-DOCUMENT-REASON-MISMATCH.REASON-NOT-ALLOWED=The report of Check {checkId} was not stored: document {position} is {readStatus} and cannot carry a reason.
RPT-400-FAILURE-INCOMPLETE=The failure of Check {checkId} was not stored: {field} is missing.
RPT-409-DECISION-ALREADY-RECORDED=Check {checkId} already has an Employee Decision.
RPT-409-CHECK-NOT-COMPLETED=Check {checkId} is not completed; a decision can only be recorded on a completed Check.
RPT-400-DECISION-INCOMPLETE.CODE-UNKNOWN=The decision was not recorded: `{value}` is not APPROVED or REJECTED.
RPT-400-DECISION-INCOMPLETE.DECIDED-BY-MISSING=The decision was not recorded: the deciding employee is missing.
RPT-400-DECISION-INCOMPLETE.APPROVAL-FLAG-MISSING=The decision was not recorded: say whether it was executed through the Approval API.
RPT-422-APPROVAL-FLAG-ON-REJECTION=The decision was not recorded: only an APPROVED decision is executed through the Approval API.
RPT-500-REPORT-NOT-STORED=The report of Check {checkId} was not stored.

# RPT purge log texts — message keys, NOT error codes (same {MOD}-LOG-{SLUG} scheme as RPT-LOG-PURGE-SKIPPED):
# the kept-run WARN line verbatim from REQ-RPT-054 / ADR-RPT-020 and the closing count line verbatim from
# REQ-RPT-046 (SVC-API ReportPurgeService steps 3 and 4). Arabic texts: PENDING ADR-RPT-013.
RPT-LOG-PURGE-KEPT=Report purge kept Check run {checkId}: its deletion failed ({cause}).
RPT-LOG-PURGE-DELETED=Report purge deleted {n} Check runs ended before {cutOff}.

# INT error catalog — English texts, verbatim from INT's OWN rows of the module's error-catalog block
# (ADR-INT-003, ADR-INT-017). Keyed by error code; named placeholders are filled from the exception's arguments.
# The PASS-THROUGH rows (CHK-…, DOC-…, RPT-…) keep their owners' texts above and are not repeated here.
# Arabic texts: PENDING ADR-INT-017 — never invented here.
INT-400-REQUEST-INVALID=The request could not be read: {detail}.
INT-409-CHECK-NOT-AWAITING-DOCUMENTS=Documents can be uploaded only while Check {checkId} is waiting for documents; its status is {status}.
INT-413-UPLOAD-TOO-LARGE=The upload is larger than the {limit} the service accepts in one request.
INT-502-APPROVAL-API-FAILED=The approval was not executed: the host Approval API answered {status}. Nothing was recorded; you can try again.
INT-504-APPROVAL-API-TIMED-OUT=The approval was not executed: the host Approval API did not answer within {timeout} seconds. Nothing was recorded; you can try again.
INT-500=The request could not be completed because of an unexpected error.

# INT request-invalid details — message keys, NOT error codes: the {detail} value of INT-400-REQUEST-INVALID
# (REQ-INT-007; AC-INT-011 "checkId must be a number"). Same {MOD}-DETAIL-{SLUG} scheme as CHK's detail keys.
# The {status} value of INT-502 when no Approval API address is configured (ADR-INT-012, CORE R1).
# The {status} value of INT-502 when the host cannot be reached (connection failure — REQ-INT-036; PORTS).
# Wording chosen in PORTS (the catalog is silent) and recorded as an api_doc_gaps row for the factory.
# Arabic texts: PENDING ADR-INT-017.
INT-DETAIL-NOT-A-NUMBER={name} must be a number
INT-DETAIL-VALUE-INVALID={name} has a value that cannot be read
INT-DETAIL-PART-MISSING=the part {name} is missing
INT-DETAIL-BODY-UNREADABLE=the body is missing or is not valid JSON
INT-DETAIL-MULTIPART-UNREADABLE=the multipart request could not be read
INT-DETAIL-CONTENT-TYPE-UNSUPPORTED=the body's Content-Type is not supported by this operation
INT-DETAIL-ACCEPT-UNSUPPORTED=no response can be produced in a media type the Accept header allows
INT-DETAIL-NO-APPROVAL-ADDRESS=no answer — no address is configured
INT-DETAIL-APPROVAL-UNREACHABLE=no answer — the host could not be reached

# INT log line — a message key, NOT an error code: the WARN of REQ-INT-039, verbatim from SVC-API-COMMAND
# (API-INT-004 step 3) — the Report Store refused the decision after the host Approval API call succeeded.
# Same {MOD}-LOG-{SLUG} scheme as RPT's log lines.
INT-LOG-APPROVAL-NOT-RECORDED=Approval executed but decision not recorded: Check {checkId}, request {requestNumber}
