spring.application.name=agentic-ai-library

# Schema: each module's db-script sql fence is a script in db/migration (V1 REG, V2 DOC, V3 CHK, V4 RPT);
# Hibernate only validates it. Flyway is DISABLED: the scripts are applied manually by the DBA (the target schema
# is shared with the host application). Set spring.flyway.enabled=true in an environment that should self-migrate;
# the baseline below V1 then lets a non-empty schema still run V1-V4.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.jpa.open-in-view=false

# Datasource (URL, user, password) is environment-provided: spring.datasource.* — never set here.

# Service Registry (REG) — environment settings, never in the deployable (ADR-REG-007, ADR-REG-009).
# Example (uncomment and set per environment):
#aias.registry.package-directory=/var/aias/packages
#aias.registry.environment-name=dev
#aias.registry.load-lock-timeout=PT30S
#aias.registry.connections[0].name=main-db
#aias.registry.connections[0].type=mcp
#aias.registry.connections[0].endpoint=mcp:main-db
#aias.registry.connections[0].query-tool=run_query
#aias.registry.connections[0].dialect=oracle19c
#aias.registry.connections[0].credential-reference=MAIN_DB_READONLY
#aias.registry.connections[0].read-only=true
#aias.registry.connections[0].limited-to-views=false

# Document Access (DOC) — environment settings, never in the deployable (REQ-DOC-010, ADR-DOC-009).
# Example (uncomment and set per environment); all optional — see DocumentAccessProperties:
#aias.documents.storage-root=/var/aias/documents
#aias.documents.data-class=REAL
#aias.documents.reading-model.provider=openai
#aias.documents.reading-model.model=
#aias.documents.reading-model.tier=FREE
#aias.documents.reading-model.instruction=Transcribe the document text exactly.

# Spring AI (DOC PORTS-MODEL). The document-reading model is DOC's own qualified bean, documentReadingModel,
# built only from aias.documents.reading-model.* (REQ-DOC-030); the comparison model is another bean. The
# starter's default chat model is therefore switched off — OpenAiChatAutoConfiguration creates it whenever
# spring.ai.model.chat is "openai" or missing, and without a credential that would fail start-up.
spring.ai.model.chat=none
# The same starter also auto-configures speech, transcription, embedding, image and moderation models, each of which
# fails start-up without a credential ("At least one credential source must be specified"). No module uses any of
# them, so they are switched off too.
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
# Connection settings of the v1 provider (openai; an OpenAI-compatible local or free-tier gateway is reached
# by base-url) — environment settings, never in the deployable. Absent api-key = a client with no credential:
#spring.ai.openai.base-url=http://localhost:11434/v1
#spring.ai.openai.api-key=

# Platform per-Check limits, one group for every module — io.agenticai.platform.config.CheckLimitsProperties
# (ADR-REG-019, ADR-DOC-016, CHK CORE, AIAS-7). Defaults apply when unset; each must be greater than 0:
#aias.check.timeout=PT2M
#aias.check.max-rows=100
#aias.check.max-file-size=10MB
#aias.check.max-uploads=20
# Check Engine (CHK) — keys of the same platform group (CHK CORE). upload-window has NO stated default and is
# REQUIRED: start-up fails until the environment sets it (REQ-CHK-060, ADR-CHK-004; open API-document gap):
#aias.check.upload-window=
#aias.check.deadline-check-interval=PT30S
#aias.check.pipeline-threads=4

# CHK comparison model — CHK's own nested group, ComparisonModelProperties (REQ-CHK-067, REQ-CHK-068). All
# optional; an absent model ends each Check FAILED / MODEL_UNAVAILABLE. Tier FREE unless declared (REQ-CHK-075):
#aias.check.comparison-model.provider=openai
#aias.check.comparison-model.model=
#aias.check.comparison-model.tier=FREE
# CHK reads the environment data class from aias.documents.data-class above (REQ-CHK-074) — no CHK key exists.

# Report Store (RPT) — environment settings, never in the deployable (ADR-RPT-004, ADR-RPT-010); ReportStoreProperties.
# retention-days is optional: absent, zero or negative → the purge deletes nothing and logs that it was skipped
# (REQ-RPT-044). The listing cap (100) is a constant, not a property (ADR-RPT-008). Example:
#aias.reports.retention-days=365
#aias.reports.purge-schedule=0 0 2 * * *

# Host Integration (INT) — environment settings, IntegrationProperties (ADR-INT-012). All optional; defaults below.
# approval.timeout: whole seconds > 0 (REQ-INT-037). approval.base-address: absent → an approval-path decision answers
# INT-502 "no answer — no address is configured" and records nothing (ADR-INT-009). upload.request-limit must not be
# below aias.check.max-file-size — start-up fails otherwise (REQ-INT-014, IntegrationLimitsCheck):
#aias.integration.approval.timeout=10s
#aias.integration.approval.base-address=https://host.example/approvals
#aias.integration.upload.request-limit=50MB
# Spring's multipart limits are bound to INT's upload request limit by placeholder (one value, REQ-INT-014): an
# upload above it raises MaxUploadSizeExceededException → INT-413-UPLOAD-TOO-LARGE. Parsing is lazy so the
# exception is raised while the INT handler's arguments are resolved and reaches IntegrationProblemAdvice
# (an eager parse fails before the handler is known, where a package-scoped advice does not apply).
spring.servlet.multipart.max-request-size=${aias.integration.upload.request-limit:50MB}
spring.servlet.multipart.max-file-size=${aias.integration.upload.request-limit:50MB}
spring.servlet.multipart.resolve-lazily=true

# Platform MCP query channel (io.agenticai.platform.mcp.SpringAiMcpQueryChannel, PORTS-QUERY) — the Spring AI MCP CLIENT
# behind DOC's and CHK's query ports. G1: an MCP tool is NEVER offered to a model, so the starter's MCP→ToolCallback
# bridge (McpToolCallbackAutoConfiguration, which would publish a ToolCallbackProvider of every MCP tool) is switched
# off here, for every environment; the channel also refuses start-up if any ToolCallbackProvider bean exists.
spring.ai.mcp.client.toolcallback.enabled=false
# Client connections are environment settings (spring.ai.mcp.client.stdio|sse|streamable-http.connections.<name>.*).
# A REG mcp connection names one by its endpoint, "mcp:<name>" (see SpringAiMcpQueryChannel). Example:
#spring.ai.mcp.client.stdio.connections.main-db.command=node
#spring.ai.mcp.client.stdio.connections.main-db.args=/opt/mcp/oracle/index.js
